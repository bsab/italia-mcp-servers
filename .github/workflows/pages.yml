name: Pages

# Pubblica il catalogo aggregato e la pagina di consultazione su GitHub Pages.
# Il contenuto e' generato da servers/: non esiste nulla di scritto a mano.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta, senza annullare quello in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Genera il sito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera site/
        run: python3 scripts/build_catalog.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Pubblica su Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
